# nginx для сервиса preview: статика репо без кеша — правки из DevTools
# и пересобранные шрифты видны сразу после перезагрузки страницы.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    add_header Cache-Control "no-store" always;
    etag off;
    if_modified_since off;
  }
}

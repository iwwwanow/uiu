name: Release

# master → semantic-release (tag + GitHub release from conventional commits) → Pages.
# Pages deploys on every push, released or not; the version comes from the latest tag
# and replaces __VERSION__ in the published files.
on:
  push:
    branches: [master]

permissions:
  contents: write
  issues: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: release
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/configure-pages@v5

      - name: Stage showcase files
        run: |
          VERSION="$(git describe --tags --abbrev=0 | sed 's/^v//')"
          echo "version: $VERSION"
          mkdir _site
          cp -r index.html ai-generated.html index.css owo.css ai-generated.css assets og.png og.svg _site/
          sed -i "s/__VERSION__/$VERSION/g" _site/index.html _site/ai-generated.html _site/index.css

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deployment
